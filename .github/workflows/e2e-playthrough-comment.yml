name: E2E Playthrough PR Comment

on:
  workflow_run:
    workflows:
      - E2E Playthrough
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  post-comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download E2E reports
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: e2e-playthrough-report
          path: target/e2e
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post E2E summary on PR
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPORT_DOWNLOAD_OUTCOME: ${{ steps.download-report.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function findReport(startDir, filename) {
              if (!fs.existsSync(startDir)) {
                return null;
              }

              const entries = fs.readdirSync(startDir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(startDir, entry.name);
                if (entry.isFile() && entry.name === filename) {
                  return fullPath;
                }
                if (entry.isDirectory()) {
                  const nested = findReport(fullPath, filename);
                  if (nested) {
                    return nested;
                  }
                }
              }

              return null;
            }

            const marker = '<!-- e2e-playthrough-summary -->';
            const pr = context.payload.workflow_run?.pull_requests?.[0];
            if (!pr) {
              console.log('No pull request attached to workflow run; skipping comment.');
              return;
            }

            const reportPath = findReport('target/e2e', 'playthrough-report.md') ?? findReport('.', 'playthrough-report.md');

            let report = '_E2E markdown report not found in workflow artifacts._';
            if (reportPath) {
              report = fs.readFileSync(reportPath, 'utf8');
            } else if (process.env.REPORT_DOWNLOAD_OUTCOME !== 'success') {
              report = `_E2E artifact download ${process.env.REPORT_DOWNLOAD_OUTCOME}; markdown report unavailable._`;
            }

            const conclusion = (process.env.WORKFLOW_CONCLUSION || 'unknown').toUpperCase();
            const maxLength = 60000;
            if (report.length > maxLength) {
              report = `${report.slice(0, maxLength)}\n\n_...truncated due to comment size limit._`;
            }

            const body = `${marker}
            ## E2E Playthrough Summary (${conclusion})

            ${report}`;

            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

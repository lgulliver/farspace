name: E2E Playthrough PR Comment

on:
  workflow_run:
    workflows:
      # Keep in sync with .github/workflows/e2e-playthrough.yml `name`.
      - E2E Playthrough
    types:
      - completed

env:
  E2E_REPORT_ARTIFACT_NAME: e2e-playthrough-report

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  post-comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download E2E reports
        id: download-report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: ${{ env.E2E_REPORT_ARTIFACT_NAME }}
        run: |
          set -euo pipefail
          mkdir -p target/e2e
          artifact_name="${ARTIFACT_NAME}"
          artifact_zip="/tmp/${artifact_name}.zip"
          artifacts_json="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          artifact_count="$(printf '%s' "${artifacts_json}" | jq -r --arg artifact_name "${artifact_name}" '[.artifacts[] | select(.name == $artifact_name)] | length')"

          artifact_id="$(printf '%s' "${artifacts_json}" | jq -r --arg artifact_name "${artifact_name}" '.artifacts[] | select(.name == $artifact_name) | .id' | head -n 1)"
          if [ -z "${artifact_id}" ]; then
            available_artifacts="$(printf '%s' "${artifacts_json}" | jq -r '[.artifacts[].name] | join(", ")')"
            if [ -z "${available_artifacts}" ]; then
              available_artifacts="none"
            fi
            echo "E2E artifact ${artifact_name} not found for workflow run ${RUN_ID}. Available artifacts: ${available_artifacts}."
            exit 1
          fi
          if [ "${artifact_count}" -gt 1 ]; then
            echo "Warning: found ${artifact_count} artifacts named ${artifact_name}; using first match."
          fi

          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" --output "${artifact_zip}"
          unzip -o "${artifact_zip}" -d target/e2e

      - name: Post E2E summary on PR
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPORT_DOWNLOAD_OUTCOME: ${{ steps.download-report.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- e2e-playthrough-summary -->';
            const pr = context.payload.workflow_run?.pull_requests?.[0];
            if (!pr) {
              console.log('No pull request attached to workflow run; skipping comment.');
              return;
            }

            const reportPath = path.join('target/e2e', 'playthrough-report.md');

            let report = '_E2E markdown report not found in workflow artifacts._';
            if (fs.existsSync(reportPath)) {
              report = fs.readFileSync(reportPath, 'utf8');
            } else if (process.env.REPORT_DOWNLOAD_OUTCOME !== 'success') {
              const downloadOutcome = process.env.REPORT_DOWNLOAD_OUTCOME || 'unknown';
              const downloadStatus = {
                failure: 'failed',
                cancelled: 'was cancelled',
                skipped: 'was skipped',
                unknown: 'status was unavailable',
              }[downloadOutcome] || `status was ${downloadOutcome}`;
              report = `_E2E artifact download ${downloadStatus}; markdown report unavailable._`;
            }

            const conclusion = {
              success: 'Success',
              failure: 'Failure',
              cancelled: 'Cancelled',
              skipped: 'Skipped',
              neutral: 'Neutral',
              timed_out: 'Timed out',
              action_required: 'Action required',
              stale: 'Stale',
            }[process.env.WORKFLOW_CONCLUSION || ''] || 'Unknown';
            const maxLength = 60000;
            if (report.length > maxLength) {
              report = `${report.slice(0, maxLength)}\n\n_...truncated due to comment size limit._`;
            }

            const body = [
              marker,
              `## E2E Playthrough Summary (${conclusion})`,
              '',
              report,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

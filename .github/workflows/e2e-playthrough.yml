name: E2E Playthrough

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  e2e-playthrough:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run 100-turn E2E playthrough
        run: cargo test -p game_e2e --test e2e_100_turn_playthrough -- --nocapture

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playthrough-report
          path: |
            target/e2e/

name: E2E Playthrough

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  e2e-playthrough:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run 100-turn E2E playthrough
        run: cargo test -p game_e2e --test e2e_100_turn_playthrough -- --nocapture

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playthrough-report
          path: |
            target/e2e/

      - name: Post E2E summary on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-playthrough-summary -->';
            const reportPath = 'target/e2e/playthrough-report.md';
            let report = '_E2E markdown report not found at `target/e2e/playthrough-report.md`._';

            if (fs.existsSync(reportPath)) {
              report = fs.readFileSync(reportPath, 'utf8');
            }

            const maxLength = 60000;
            if (report.length > maxLength) {
              report = `${report.slice(0, maxLength)}\n\n_...truncated due to comment size limit._`;
            }

            const body = `${marker}
            ## E2E Playthrough Summary

            ${report}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

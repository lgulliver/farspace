name: E2E Playthrough

on:
  pull_request:
  push:
    branches:
      - main

env:
  E2E_REPORT_ARTIFACT_NAME: e2e-playthrough-report

jobs:
  e2e-playthrough:
    runs-on: ubuntu-latest
    # PR comments now come from trusted workflow_run follow-up workflow.
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run 100-turn E2E playthrough
        run: cargo test -p game_e2e --test e2e_100_turn_playthrough -- --nocapture

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.E2E_REPORT_ARTIFACT_NAME }}
          path: |
            target/e2e/

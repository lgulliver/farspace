name: nightly

on:
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Override nightly tag (default: nightly-YYYYMMDD-HHMM)"
        required: false
        type: string

jobs:
  setup:
    name: Set nightly tag
    runs-on: ubuntu-latest
    outputs:
      nightly_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set nightly tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag_override }}" ]; then
            echo "tag=${{ inputs.tag_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

  generate-notes:
    name: Generate release notes
    needs: setup
    uses: ./.github/workflows/nightly-notes.lock.yml
    with:
      nightly_tag: ${{ needs.setup.outputs.nightly_tag }}

  build:
    name: Build ${{ matrix.target }}
    needs: [setup, generate-notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: farspace-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: farspace-linux-aarch64
            cross: true
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: farspace-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: farspace-macos-aarch64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: farspace-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p farspace

      - name: Build (cargo)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} -p farspace

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/farspace ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\farspace.exe" "${{ matrix.artifact }}.exe"

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.exe

  release:
    name: Publish nightly release
    needs: [setup, generate-notes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: farspace-*
          path: artifacts

      - name: Create nightly tag
        run: |
          git tag "${{ needs.setup.outputs.nightly_tag }}"
          git push origin "${{ needs.setup.outputs.nightly_tag }}"

      - name: Build release body
        id: body
        run: |
          TAG="${{ needs.setup.outputs.nightly_tag }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo 'body<<BODY_EOF'
            echo "> Nightly build \`${TAG}\` — ${DATE}"
            echo ""
            cat release-notes.md
            echo ""
            echo "---"
            echo "_This is an automated pre-release build. Not production-ready._"
            echo 'BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.nightly_tag }}
          name: "Nightly ${{ needs.setup.outputs.nightly_tag }}"
          body: ${{ steps.body.outputs.body }}
          prerelease: true
          files: |
            artifacts/farspace-linux-x86_64/farspace-linux-x86_64
            artifacts/farspace-linux-aarch64/farspace-linux-aarch64
            artifacts/farspace-macos-x86_64/farspace-macos-x86_64
            artifacts/farspace-macos-aarch64/farspace-macos-aarch64
            artifacts/farspace-windows-x86_64/farspace-windows-x86_64.exe

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  generate-notes:
    name: Generate release notes
    uses: ./.github/workflows/nightly-notes.lock.yml
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    secrets: inherit
    with:
      nightly_tag: ${{ github.ref_name }}

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: farspace-linux-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: farspace-linux-aarch64
            cross: true
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: farspace-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: farspace-macos-aarch64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: farspace-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p farspace

      - name: Build (cargo)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} -p farspace

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/farspace ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\farspace.exe" "${{ matrix.artifact }}.exe"

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.exe

  release:
    name: Create GitHub release
    needs: [build, generate-notes]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: artifacts

      - name: Build release body
        id: body
        run: |
          TAG="${{ github.ref_name }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo 'body<<BODY_EOF'
            echo "> FARSPACE release \`${TAG}\` — ${DATE}"
            echo ""
            cat release-notes.md
            echo 'BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.body.outputs.body }}
          files: |
            artifacts/farspace-linux-x86_64/farspace-linux-x86_64
            artifacts/farspace-linux-aarch64/farspace-linux-aarch64
            artifacts/farspace-macos-x86_64/farspace-macos-x86_64
            artifacts/farspace-macos-aarch64/farspace-macos-aarch64
            artifacts/farspace-windows-x86_64/farspace-windows-x86_64.exe

[workspace]
resolver = "2"
members = [
    "crates/game_core",
    "crates/game_content",
    "crates/game_save",
    "crates/game_tui",
    "crates/farspace",
    "crates/game_e2e",
]

[workspace.dependencies]
rand = { version = "0.8", features = ["std_rng"] }
rand_chacha = { version = "0.3", features = ["serde1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.29"
unicode-width = "0.2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
